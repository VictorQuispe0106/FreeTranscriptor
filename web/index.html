<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var lines = $("lines");
  var currentEvent;

  var ACTIONS = {
    "start": "btn-start",
    "stop": "btn-stop",
    "summary": "btn-summary",
    "summary-live": "btn-summary-live",
    "cancel-summary": "btn-cancel-summary",
    "export-txt": "btn-export-txt",
    // open / export-history are history-relative actions handled in code
  };
  var HISTORY_DISABLE = "btn-history-open btn-history-txt btn-history-resume";

  // --- inline notices (never alert) ------------------------------------- //

  function notice(text, kind, extraButton) {
    var host = $("notices");
    host.classList.remove("hidden");
    var bar = document.createElement("div");
    var tone = kind === "error" ? "error-container" : "surface-container-high";
    var toneText = kind === "error" ? "on-error-container" : "on-surface";
    bar.className = "mb-1 px-2 py-1 rounded border border-outline-variant " +
      "bg-" + tone + " text-" + toneText +
      " font-label-sm text-label-sm flex items-center justify-between";
    var label = document.createElement("span");
    label.textContent = text;
    bar.appendChild(label);
    var close = document.createElement("button");
    close.className = "px-2 hover:text-primary transition-colors";
    close.textContent = "×";
    close.addEventListener("click", function () {
      bar.remove();
      if (!host.children.length) host.classList.add("hidden");
    });
    if (extraButton) {
      bar.appendChild(extraButton);
    }
    bar.appendChild(close);
    bar.dataset.banner = "1";
    host.appendChild(bar);
    return bar;
  }

  function lastNoticeText() {
    var host = $("notices");
    if (!host.children.length) return "";
    return host.lastChild.textContent;
  }

  // --- transcript rows --------------------------------------------------- //

  var ROW_BASE = "group flex items-start space-x-2.5 p-1.5 rounded " +
    "hover:bg-surface-container transition-colors duration-100 " +
    "border border-transparent hover:border-outline-variant";
  var TAIL_BASE = "flex items-start space-x-2.5 p-2 rounded bg-surface-container " +
    "border border-primary-container/30 shadow-[inset_0_0_8px_rgba(0,242,195,0.08)]";
  var CHIP = "font-mono-timestamp text-mono-timestamp text-outline shrink-0";

  function buildRow(stamp, text, provisional) {
    var row = document.createElement("div");
    row.className = provisional ? TAIL_BASE : ROW_BASE;
    row.dataset.provisional = provisional ? "1" : "0";
    var chip = document.createElement("span");
    chip.className = provisional
      ? "font-mono-timestamp text-mono-timestamp text-primary-fixed-dim shrink-0"
      : CHIP;
    chip.textContent = "[" + stamp + "]";
    var p = document.createElement("p");
    p.className = "text-on-surface leading-relaxed";
    p.textContent = text;
    row.appendChild(chip);
    row.appendChild(p);
    if (provisional) {
      // Blinking cursor marks it as a growing tail row.
      var cursor = document.createElement("span");
      cursor.className = "inline-block w-2 h-4 bg-primary-container align-middle " +
        "ml-1 animate-blink shadow-[0_0_6px_#00f2c3]";
      p.appendChild(cursor);
    }
    return row;
  }

  // The confirmed row REPLACES the provisional tail (tkinter parity): the
  // tail row is removed, never kept, so a caption renders exactly once.
  function removeTail() {
    var last = lines.lastElementChild;
    if (last && last.dataset && last.dataset.provisional === "1") {
      lines.removeChild(last);
    }
  }

  function applyFilter() {
    var needle = $("filterInput").value.trim().toLowerCase();
    var children = Array.prototype.slice.call(lines.children);
    children.forEach(function (row) {
      var hay = (row.textContent || "").toLowerCase();
      if (!needle || hay.indexOf(needle) !== -1) {
        row.classList.remove("hidden");
      } else {
        row.classList.add("hidden");
      }
    });
  }

  // --- panels ------------------------------------------------------------ //

  function showTab(which) {
    var transOn = which === "transcripcion";
    $("panel-transcripcion").classList.toggle("hidden", !transOn);
    $("panel-resumen").classList.toggle("hidden", transOn);
    $("tab-transcripcion").classList.toggle("border-primary-container", transOn);
    $("tab-transcripcion").classList.toggle("text-on-surface", transOn);
    $("tab-transcripcion").classList.toggle("text-on-surface-variant", !transOn);
    $("tab-resumen").classList.toggle("border-primary-container", !transOn);
    $("tab-resumen").classList.toggle("text-on-surface", !transOn);
    $("tab-resumen").classList.toggle("text-on-surface-variant", transOn);
  }

  // --- actions (single JSON POST helper) --------------------------------- //

  function act(action, extra) {
    var body = extra || {};
    body.action = action;
    return fetch("/api/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); })
      .then(function (out) {
        if (!out.ok && out.error) {
          notice(out.error, "error");
        }
        return out;
      })
      .catch(function (err) { notice(String(err), "error"); });
  }

  function wireAction(id, action, redirectPanel) {
    $(id).addEventListener("click", function () {
      if (redirectPanel) showTab("resumen");
      act(action);
    });
  }

  // --- history ----------------------------------------------------------- //

  function selectedHistory() {
    return $("history-sessions").value || "";
  }

  function renderHistory(items) {
    var select = $("history-sessions");
    var previous = select.value;
    select.innerHTML = "";
    if (!items.length) {
      select.disabled = true;
      updateHistoryButtons(true);
      return;
    }
    items.forEach(function (name) {
      var option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });
    select.disabled = false;
    var keep = Array.prototype.some.call(
      select.options, function (o) { return o.value === previous; });
    if (keep) select.value = previous;
    updateHistoryButtons(false);
  }

  function updateHistoryButtons(disabled) {
    HISTORY_DISABLE.split(" ").forEach(function (id) {
      $(id).disabled = disabled;
    });
  }

  function wireHistoryButtons() {
    $("btn-history-open").addEventListener("click", function () {
      act("open", { "name": selectedHistory() });
    });
    $("btn-history-txt").addEventListener("click", function () {
      act("export-history", { "name": selectedHistory() });
    });
    $("btn-history-resume").addEventListener("click", function () {
      act("summary", { "name": selectedHistory() });
      showTab("resumen");
    });
  }

  // --- copy helpers ------------------------------------------------------ //

  function copyText(text, label) {
    navigator.clipboard.writeText(text).then(
      function () { notice(label + " copiado al portapapeles."); },
      function () { notice("No se pudo usar el portapapeles.", "error"); });
  }

  function wireCopyButtons() {
    $("btn-copy").addEventListener("click", function () {
      var text = lines.textContent.replace(/\n\s*\n/g, "\n").trim();
      if (!text) {
        notice("Todavía no hay transcript para copiar.");
        return;
      }
      copyText(text, "Transcript");
    });
    $("btn-copy-summary").addEventListener("click", function () {
      fetch("/api/resumen-text").then(function (r) { return r.json(); })
        .then(function (out) {
          if (out.text) {
            copyText(out.text, "Resumen");
          } else if (out.error) {
            notice(out.error, "error");
          } else {
            notice("Todavía no hay resumen.");
          }
        })
        .catch(function (err) { notice(String(err), "error"); });
    });
  }

  // --- state ------------------------------------------------------------- //

  function applyState(st) {
    renderHistory(st.history || []);
    if (st.status) {
      $("footer-status").textContent = st.status;
    }
    // Recording controls mirror the orchestrator session state.
    $("btn-start").disabled = !!st.transcribing || !!st.starting;
    $("btn-stop").disabled = !st.transcribing;
    if (st.starting) {
      $("footer-status").textContent = "Abriendo Subtitulos en vivo...";
    }
    // Without Pi the summary buttons are inert.
    var pi = st.piAvailable !== false;
    ["btn-summary", "btn-summary-live", "btn-history-resume"].forEach(
      function (id) { $(id).disabled = !pi; });
    $("btn-cancel-summary").disabled = !st.summaryRunning;
  }

  // --- SSE --------------------------------------------------------------- //

  function connectEvents() {
    currentEvent = new EventSource("/events");
    currentEvent.onopen = function () {
      $("footer-sse").textContent = "SSE: conectado";
    };
    currentEvent.onerror = function () {
      $("footer-sse").textContent = "SSE: reconectando...";
    };
    currentEvent.addEventListener("message", function (ev) {
      var data;
      try {
        data = JSON.parse(ev.data);
      } catch (err) {
        return; // ignore malformed payloads
      }
      handleEvent(data);
    });
  }

  function handleEvent(data) {
    switch (data.type) {
      case "line": {
        if (data.text) {
          removeTail();
          lines.appendChild(buildRow(data.stamp, data.text, false));
          $("lines-count").textContent =
            String(lines.children.length) + " líneas";
          applyFilter();
        }
        break;
      }
      case "tail": {
        if (data.text) {
          var tailTail = lines.lastElementChild;
          var provisional = tailTail && tailTail.dataset &&
            tailTail.dataset.provisional === "1";
          if (provisional) {
            tailTail.lastChild.textContent = data.text;
            var cursor = document.createElement("span");
            cursor.className = "inline-block w-2 h-4 bg-primary-container " +
              "align-middle ml-1 animate-blink shadow-[0_0_6px_#00f2c3]";
            tailTail.lastChild.appendChild(cursor);
          } else {
            lines.appendChild(buildRow(data.stamp, data.text, true));
          }
          applyFilter();
        }
        break;
      }
      case "status": {
        $("footer-status").textContent = data.text;
        break;
      }
      case "state": {
        applyState(data);
        break;
      }
      case "history": {
        renderHistory((data.items || []).map(function (item) {
          return typeof item === "string" ? item : item.name;
        }));
        break;
      }
      case "summaryStarted": {
        showTab("resumen");
        $("resumen-indicator").className = "w-2 h-2 rounded-full " +
          "bg-primary-container animate-ping";
        break;
      }
      case "summaryProgress":
      case "summaryDelta": {
        if (data.text) {
          $("summary-log").appendChild(
            document.createTextNode(data.text + "\n"));
        }
        break;
      }
      case "summaryDone": {
        $("resumen-indicator").className = "w-1.5 h-1.5 rounded-full bg-outline";
        if (data.ok) {
          $("summary-log").appendChild(
            document.createTextNode("Resumen guardado.\n"));
        }
        break;
      }
      case "summaryFailed": {
        if (data.text) {
          $("summary-log").appendChild(
            document.createTextNode(data.text + "\n"));
        }
        notice("El resumen falló.", "error");
        break;
      }
      case "watcherLost": {
        var retry = document.createElement("button");
        retry.className = "px-2 py-0.5 rounded bg-primary-container " +
          "text-on-primary-fixed font-label-sm text-label-sm";
        retry.textContent = "Reanudar";
        retry.addEventListener("click", function (ev) {
          var banner = ev.currentTarget.closest("[data-banner]");
          if (banner) banner.remove();
          if (!$("notices").children.length) {
            $("notices").classList.add("hidden");
          }
          act("start", { "resume": true });
        });
        notice((data.message || "El watcher terminó.") +
          " Sesión interrumpida.", "error", retry);
        break;
      }
      case "ping":
      default:
        break; // keep-alive only
    }
  }

  // --- open current transcript ------------------------------------------- //

  function wireOpenLast() {
    $("btn-open").addEventListener("click", function () {
      // The newest *_live-captions.md IS the session the last line came from.
      fetch("/api/state").then(function (r) { return r.json(); })
        .then(function (st) {
          var names = st.history || [];
          if (names.length) {
            act("open", { "name": names[0] });
          } else {
            notice("Todavía no hay transcript para abrir.");
          }
        })
        .catch(function (err) { notice(String(err), "error"); });
    });
  }

  // --- bootstrap ----------------------------------------------------------- //

  document.addEventListener("DOMContentLoaded", function () {
    // Drop template whitespace text nodes: rows append dynamically.
    $("lines").textContent = "";
    $("summary-log").textContent = "";
    wireAction("btn-start", "start");
    wireAction("btn-stop", "stop");
    wireAction("btn-summary", "summary", true);
    wireAction("btn-summary-live", "summary-live", true);
    wireAction("btn-cancel-summary", "cancel-summary");
    wireAction("btn-export-txt", "export-txt");
    wireHistoryButtons();
    wireCopyButtons();
    wireOpenLast();
    showTab("transcripcion");           // default panel
    $("filterInput").addEventListener("input", applyFilter);
    $("tab-transcripcion").addEventListener("click",
      function () { showTab("transcripcion"); });
    $("tab-resumen").addEventListener("click",
      function () { showTab("resumen"); });

    // Initial state, then live events: one render, then push updates.
    fetch("/api/state")
      .then(function (r) { return r.json(); })
      .then(function (st) {
        applyState(st);
        connectEvents();
      })
      .catch(function (err) { notice(String(err), "error"); });
  });
})();
</script>
</body></html>
